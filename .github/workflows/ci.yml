name: Build RPGScript extension

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:vsix
      - run: node scripts/test-duplicate-diagnostics.js dist/server.js
      - uses: actions/upload-artifact@v4
        with:
          name: rpgscript-vs-${{ matrix.os }}
          path: "*.vsix"
